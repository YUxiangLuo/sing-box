name: Build OpenWrt IPK (aarch64_cortex-a53)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]

permissions:
  contents: write   # 需要写权限才能发布到 Releases

jobs:
  build-ipk-a53:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build sing-box for linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          set -eux
          mkdir -p dist/root/usr/bin
          go mod download
          go build -v -trimpath -ldflags="-s -w" -o dist/root/usr/bin/sing-box ./cmd/sing-box
          file dist/root/usr/bin/sing-box
          chmod +x dist/root/usr/bin/sing-box

      - name: Pack as OpenWrt IPK (aarch64_cortex-a53)
        run: |
          set -eux

          # 版本号：tag 优先；否则用 git 短哈希
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            PKG_VERSION="${GITHUB_REF_NAME}"
          else
            PKG_VERSION="git-${GITHUB_SHA::7}"
          fi
          echo "Package version: $PKG_VERSION"

          ROOT="dist/root"
          WORK="dist/ipk"
          CTRL="$WORK/CONTROL"
          mkdir -p "$WORK" "$CTRL"

          # control 文件
          cat > "$CTRL/control" <<EOF
          Package: sing-box
          Version: $PKG_VERSION
          Architecture: aarch64_cortex-a53
          Maintainer: You <you@example.com>
          Section: net
          Priority: optional
          Description: sing-box - universal proxy platform (aarch64_cortex-a53)
          EOF

          # 简单的 postinst
          cat > "$CTRL/postinst" <<'EOF'
          #!/bin/sh
          set -e
          [ -x /usr/bin/sing-box ] && echo "sing-box installed."
          exit 0
          EOF
          chmod +x "$CTRL/postinst"

          # 压缩内容到 dist 目录
          (cd "$ROOT" && tar -czf ../../data.tar.gz .)
          (cd "$CTRL" && tar -czf ../../control.tar.gz .)

          # debian-binary 固定为 2.0
          echo "2.0" > dist/debian-binary

          # 在 dist 目录下打包 ipk
          cd dist
          IPK="sing-box_${PKG_VERSION}_aarch64_cortex-a53.ipk"
          ar rcs "$IPK" debian-binary control.tar.gz data.tar.gz

          # 校验
          sha256sum *.ipk > checksums.txt

          # 检查 IPK 内部结构
          echo "Check IPK content:"
          ar t "$IPK"

          # 解包并打印 control 内容（方便在日志里确认）
          mkdir -p check && cd check
          ar x ../"$IPK"
          tar -xzf control.tar.gz
          echo "Control file content:"
          cat control

      - name: Upload artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-aarch64_cortex-a53-ipk
          path: |
            dist/*.ipk
            dist/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release (only on tag)
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: sing-box ${{ github.ref_name }} (aarch64_cortex-a53)
          draft: false
          prerelease: false
          files: |
            dist/*.ipk
            dist/checksums.txt
