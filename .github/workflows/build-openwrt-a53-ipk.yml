name: Build OpenWrt IPK (aarch64_cortex-a53)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]

permissions:
  contents: write   # 需要写权限才能发布到 Releases

jobs:
  build-ipk-a53:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build sing-box for linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          set -eux
          mkdir -p dist/root/usr/bin
          go mod download
          go build -v -trimpath -ldflags="-s -w" -o dist/root/usr/bin/sing-box ./cmd/sing-box
          file dist/root/usr/bin/sing-box
          chmod +x dist/root/usr/bin/sing-box

      - name: Pack as OpenWrt IPK (aarch64_cortex-a53)
        run: |
          set -eux

          # 版本号：tag 优先；否则用 git 短哈希
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            PKG_VERSION="${GITHUB_REF_NAME}"
          else
            PKG_VERSION="git-${GITHUB_SHA::7}"
          fi
          echo "Package version: $PKG_VERSION"

          ROOT="dist/root"
          WORK="dist/ipk"
          CTRL="$WORK/CONTROL"
          mkdir -p "$WORK" "$CTRL"

          # control（最简必要字段，按需添加 Depends/Conflicts 等）
          cat > "$CTRL/control" <<EOF
          Package: sing-box
          Version: $PKG_VERSION
          Architecture: aarch64_cortex-a53
          Maintainer: You <you@example.com>
          Section: net
          Priority: optional
          Description: sing-box - universal proxy platform (aarch64_cortex-a53)
          EOF

          # 可选脚本
          cat > "$CTRL/postinst" <<'EOF'
          #!/bin/sh
          set -e
          [ -x /usr/bin/sing-box ] && echo "sing-box installed."
          exit 0
          EOF
          chmod +x "$CTRL/postinst"

          # 生成 data.tar.gz（实际文件内容）与 control.tar.gz（包元数据）
          (cd "$ROOT" && tar -czf ../data.tar.gz .)
          (cd "$CTRL" && tar -czf ../control.tar.gz .)

          # debian-binary 固定为 "2.0"
          echo "2.0" > "$WORK/debian-binary"

          # 用 ar 打包为 .ipk
          IPK="dist/sing-box_${PKG_VERSION}_aarch64_cortex-a53.ipk"
          (cd "$WORK" && ar r "../tmp.ipk" debian-binary control.tar.gz ../data.tar.gz)
          mv dist/tmp.ipk "$IPK"

          # 校验文件
          (cd dist && sha256sum *.ipk > checksums.txt)

      - name: Upload artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-aarch64_cortex-a53-ipk
          path: |
            dist/*.ipk
            dist/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub Release (only on tag)
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: sing-box ${{ github.ref_name }} (aarch64_cortex-a53)
          draft: false
          prerelease: false
          files: |
            dist/*.ipk
            dist/checksums.txt
